[project]
name = "talki"
version = "0.1.0"
description = "Local, private voice dictation for Linux. Speak anywhere, get clean text at your cursor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Justin" }]
keywords = ["dictation", "speech-to-text", "whisper", "wayland", "kde", "voice"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# PySide6 is intentionally not listed. Talki uses the distro build (pacman -S pyside6)
# because the layer-shell-qt QML plugin is compiled against the system Qt.
dependencies = [
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.6",
    "numpy>=2.3",
    "httpx>=0.28.1",
    "dbus-fast>=5.0.22",
    "evdev>=2.0.0",
    "platformdirs>=4.11",
]

[project.optional-dependencies]
# Only for systems without a distro PySide6. The overlay then falls back to a plain window.
pypi-qt = ["PySide6>=6.11"]

[project.scripts]
talki = "talki.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
